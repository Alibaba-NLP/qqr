judge_rubric: 'Evaluate the Micron FY2025 debt service capacity analysis against the
  following rubric:


  POSITIVE SCORING ITEMS (total 100%):

  1. [Weight 15%] Accurate extraction of FY2025 operating cash flow ($17.5B) and total
  debt figures

  2. [Weight 15%] Interest coverage ratio calculation with appropriate benchmarking

  3. [Weight 12%] Debt-to-OCF ratio calculation and historical comparison

  4. [Weight 12%] Free cash flow calculation ($17.5B - $13.8B = $3.7B) and its implications
  for debt service

  5. [Weight 10%] Identification of major debt maturity dates in the 3-5 year window

  6. [Weight 10%] Assessment of refinancing risk given current rate environment

  7. [Weight 8%] Analysis of whether $20B FY2026 CapEx guidance creates additional
  refinancing pressure

  8. [Weight 8%] Comparison of leverage metrics to semiconductor peer averages

  9. [Weight 10%] Overall credit quality assessment with forward-looking perspective


  NEGATIVE SCORING ITEMS (deduct when present):

  10. [Deduct 6%] Confusing stock-based compensation adjustments with operating cash
  flow

  11. [Deduct 4%] Missing currency units or inconsistent time periods

  12. [Deduct 4%] Ignoring the interaction between CapEx commitments and debt service
  obligations

  13. [Deduct 4%] Emotive language or unsupported conclusions about default risk'
reference_solution: '1. Interest Coverage: OCF $17.5B supports strong interest coverage;
  total debt declining from peak levels.

  2. Debt-to-OCF: With $17.5B OCF, leverage ratio improving; FCF of $3.7B ($17.5B
  - $13.8B) provides debt repayment capacity.

  3. Maturity Schedule: Major maturities spread across 2026-2030; refinancing risk
  moderate given improving credit metrics.

  4. FY2026 CapEx of $20B will pressure FCF but OCF growth from HBM revenue should
  offset; debt service remains manageable.'
primary_dimensions:
- completion
- communication
