task_id: syn_T069_v002
task_name: Micron FY2025 Debt Service Capacity Analysis
version: '1.0'
category: finance
difficulty: easy
tags:
- general
services:
- name: web_real
  command: python mock_services/web_real/server.py
  port: 9114
  health_check: http://localhost:9114/web/health
  health_check_method: GET
  ready_timeout: 10
  reset_endpoint: http://localhost:9114/web/reset
prompt:
  text: 'Micron Technology has historically carried significant debt load given the
    capital-intensive nature of semiconductor manufacturing. In FY2025, the company
    undertook a major capital expenditure program exceeding $13 billion to support
    HBM and advanced DRAM nodes.


    As a credit analyst, you are asked to evaluate Micron''s debt service capacity
    and refinancing risk profile. Using Micron Technology''s FY2025 (full year) financial
    data, complete the following analyses:


    1. Interest Coverage Ratio: Using FY2025 operating income and interest expense
    data, calculate the interest coverage ratio (Operating Income / Interest Expense).
    Assess whether the coverage is adequate relative to investment-grade thresholds.


    2. Debt-to-OCF Ratio: Calculate the ratio of total debt to operating cash flow.
    Compare this to the company''s historical leverage levels and peer averages. With
    $17.5B in OCF, evaluate whether the company is on a sustainable deleveraging trajectory.


    3. Maturity Schedule and Refinancing Risk: Identify Micron''s major debt maturity
    dates over the next 3-5 years. Assess the refinancing risk given the current interest
    rate environment. With the company''s CapEx guidance of $20B for FY2026, analyze
    whether free cash flow of $3.7B (OCF $17.5B less CapEx $13.8B) provides sufficient
    buffer for debt repayment alongside ongoing investment needs.'
  language: en
