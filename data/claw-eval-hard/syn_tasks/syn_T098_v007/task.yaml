task_id: syn_T098_v007
task_name: Pinbench OpenClaw Comparisons v7
version: '1.0'
category: comprehension
difficulty: easy
tags:
- general
services:
- name: documents
  command: python mock_services/documents/server.py
  port: 9116
  health_check: http://localhost:9116/documents/health
  health_check_method: GET
  ready_timeout: 10
  reset_endpoint: http://localhost:9116/documents/reset
  env:
    DOCUMENTS_BASE_DIR: tasks/syn_T098_v007
    PORT: '9116'
prompt:
  text: 'Use the PDF parsing tool to read

    `fixtures/docs/OpenClaw Agent Use Cases and Gap Analysis for PinchBench.pdf`

    and answer the six questions below. Give all answers on a single line,

    separated by commas.


    Questions:

    1. How does the largest category count compare to the second-largest?

    2. How many skills were removed by filtering?

    3. What is the ratio of filtered to original skills?

    4. What is the largest category name?

    5. What is the second-largest category name?

    6. How many proposed tasks are there?

    '
  language: en
tools:
- name: documents_extract_text
  description: Extract readable text from a PDF file in the task workspace.
  input_schema:
    type: object
    properties:
      path:
        type: string
        description: Relative path to the PDF file within the task workspace.
      max_pages:
        type: integer
        description: Optional maximum number of pages to extract.
    required:
    - path
tool_endpoints:
- tool_name: documents_extract_text
  url: http://localhost:9116/documents/extract_text
  method: POST
sandbox_files:
- fixtures/docs/OpenClaw Agent Use Cases and Gap Analysis for PinchBench.pdf
environment:
  timeout_seconds: 120
  max_turns: 4
scoring_components:
- name: extract_text
  weight: 0.1
  check:
    type: tool_called
    tool_name: documents_extract_text
    min_calls: 1
- name: fact_1_total
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - '5705'
- name: fact_2_filtered
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - '2999'
- name: fact_3_largest
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - AI & LLMs
    - '287'
- name: fact_4_second
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - Search & Research
    - '253'
- name: fact_5_file
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - SKILL.md
- name: fact_6_api
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - WebSocket
- name: fact_7_date
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - February 7, 2026
- name: fact_8_count
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - '6'
- name: length
  weight: 0.1
  check:
    type: min_length
    min_length: 50
safety_checks: []
expected_actions: []
judge_rubric: Reward correct comparative answers to all six questions, comma-separated
  on one line.
reference_solution: 287 vs 253, 2706, 2999/5705, AI & LLMs, Search & Research, 6
primary_dimensions:
- completion
- communication
- safety
