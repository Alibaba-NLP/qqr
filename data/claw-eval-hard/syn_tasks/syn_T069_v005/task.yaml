expected_actions: []
judge_rubric: 'Evaluate the Micron HBM investment thesis analysis against the following
  rubric:


  POSITIVE SCORING ITEMS (total 100%):

  1. [Weight 12%] HBM revenue contribution estimate with methodology explanation

  2. [Weight 12%] ASP premium quantification (HBM vs DDR5 comparison)

  3. [Weight 10%] Analysis of how HBM mix drives margin expansion from $17.5B OCF

  4. [Weight 10%] CapEx allocation breakdown showing HBM packaging investment within
  $13.8B total

  5. [Weight 10%] Back-end packaging equipment as the key bottleneck and investment
  focus

  6. [Weight 10%] 10% NAND capacity reduction as enabler for DRAM/HBM reallocation

  7. [Weight 8%] Opportunity cost analysis of capacity reallocation

  8. [Weight 8%] FY2026 $20B CapEx justification based on HBM revenue trajectory

  9. [Weight 8%] $42.6B breakeven analysis in context of HBM-driven growth

  10. [Weight 6%] Competitive sustainability assessment vs Samsung and SK Hynix HBM
  ramps

  11. [Weight 6%] Clear conclusion on whether HBM thesis justifies the investment
  level


  NEGATIVE SCORING ITEMS (deduct when present):

  12. [Deduct 5%] Confusing HBM with conventional DRAM in the analysis

  13. [Deduct 4%] Missing currency units or unrealistic ASP premium estimates

  14. [Deduct 4%] Ignoring competitive dynamics in HBM market'
reference_solution: '1. HBM ASP Premium: HBM commands 3-5x DDR5 ASP; contributes meaningfully
  to $17.5B OCF on ~$37B revenue.

  2. Capacity Allocation: 10% NAND reduction frees wafer capacity for DRAM/HBM; $13.8B
  CapEx heavily weighted to back-end packaging.

  3. Packaging Bottleneck: HBM requires advanced TSV and packaging; Micron investing
  heavily here.

  4. FY2026 $20B CapEx justified if HBM revenue grows 40-60% YoY; breakeven at $42.6B
  achievable with HBM mix.

  5. Sustainability Risk: As Samsung and SK Hynix ramp HBM, ASP premiums may compress;
  Micron needs cost leadership.'
primary_dimensions:
- completion
- communication
