task_id: syn_T069_v005
task_name: Micron FY2025 HBM Investment Thesis Analysis
version: '1.0'
category: finance
difficulty: easy
tags:
- general
services:
- name: web_real
  command: python mock_services/web_real/server.py
  port: 9114
  health_check: http://localhost:9114/web/health
  health_check_method: GET
  ready_timeout: 10
  reset_endpoint: http://localhost:9114/web/reset
prompt:
  text: 'High Bandwidth Memory (HBM) has become the critical growth driver for memory
    semiconductor companies, fueled by AI accelerator demand from NVIDIA, AMD, and
    custom chip designers. Micron Technology has positioned HBM as central to its
    FY2025 capital allocation strategy.


    As a semiconductor equity analyst, evaluate Micron''s HBM investment thesis using
    FY2025 financial data and publicly available industry information. Complete the
    following analyses:


    1. HBM Revenue Contribution and ASP Premium: Estimate HBM''s contribution to Micron''s
    FY2025 revenue. HBM commands a significant ASP premium over conventional DDR5
    DRAM — estimate this premium (typically 3-5x). With total revenue around $37B
    and operating cash flow of $17.5B, assess how much of the margin expansion is
    attributable to HBM mix improvement.


    2. Capacity Allocation Analysis: Micron has committed significant CapEx ($13.8B
    in FY2025) to HBM-related investment, particularly in back-end packaging equipment.
    Analyze the capacity allocation trade-off: how does the 10% NAND wafer capacity
    reduction free up resources for HBM/DRAM? What is the opportunity cost of this
    reallocation?


    3. Investment Sustainability: With FY2026 CapEx guided to $20B, much of it for
    HBM packaging and advanced nodes, assess whether the HBM revenue trajectory justifies
    this spending. Consider the breakeven revenue of $42.6B needed to maintain FCF
    >= 0 (at 47% OCF margin). Are HBM ASP premiums sustainable as competitors (Samsung,
    SK Hynix) also ramp HBM capacity?'
  language: en
