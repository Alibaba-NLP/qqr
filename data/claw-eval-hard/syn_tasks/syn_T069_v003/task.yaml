judge_rubric: 'Evaluate the Micron peer comparison analysis against the following
  rubric:


  POSITIVE SCORING ITEMS (total 100%):

  1. [Weight 15%] Accurate CapEx/Revenue calculation for Micron ($13.8B / ~$37B)

  2. [Weight 12%] Samsung Semiconductor CapEx intensity comparison with data

  3. [Weight 12%] SK Hynix CapEx intensity comparison with data

  4. [Weight 12%] FCF yield calculation for Micron ($3.7B FCF) and peer comparison

  5. [Weight 10%] HBM investment timeline comparison across three companies

  6. [Weight 10%] Analysis of Micron''s back-end packaging investment vs peers'' approaches

  7. [Weight 8%] Discussion of NAND capacity discipline (10% reduction) in peer context

  8. [Weight 8%] Assessment of Idaho and New York fab investments vs international
  peer expansion

  9. [Weight 8%] Overall conclusion on which company has most sustainable CapEx trajectory

  10. [Weight 5%] Clear relative positioning conclusion


  NEGATIVE SCORING ITEMS (deduct when present):

  11. [Deduct 6%] Fabricating specific peer financial figures without search verification

  12. [Deduct 4%] Failing to distinguish between consolidated and semiconductor-only
  segment data

  13. [Deduct 4%] Ignoring currency differences (KRW vs USD) in comparisons'
reference_solution: '1. CapEx Intensity: Micron $13.8B/~$37B = ~37% CapEx/Revenue.
  Samsung and SK Hynix also at elevated levels (~35-45%).

  2. FCF Yield: Micron FCF $3.7B ($17.5B OCF - $13.8B CapEx); peers have varying FCF
  profiles based on CapEx cycles.

  3. HBM Race: SK Hynix leads in HBM market share; Samsung catching up; Micron investing
  in back-end packaging.

  4. Peer comparison shows Micron''s 10% NAND reduction + Idaho/NY fab investments
  as differentiated approach vs peers'' broad expansion.

  5. Sustainability: Micron''s focused CapEx on HBM/packaging may yield better returns
  than peers'' broader capacity additions.'
