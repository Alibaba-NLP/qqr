prompt:
  text: 'The global memory semiconductor industry is dominated by three major players:
    Samsung Electronics, SK Hynix, and Micron Technology. Each company has pursued
    different capital expenditure strategies in the current AI-driven memory supercycle.


    As an industry analyst, compare Micron''s capital allocation strategy against
    its two major peers. Using publicly available financial data for FY2025 (or the
    most recent fiscal year), complete the following:


    1. CapEx Intensity Comparison: Calculate CapEx/Revenue ratio for Micron, Samsung
    Semiconductor, and SK Hynix. Micron''s FY2025 CapEx was $13.8B against revenue
    of approximately $37B. Compare this intensity to Samsung and SK Hynix''s equivalent
    metrics. Who is investing most aggressively relative to size?


    2. FCF Yield Comparison: Calculate free cash flow yield (FCF/Market Cap) for all
    three companies. Micron''s FCF of $3.7B ($17.5B OCF minus $13.8B CapEx) should
    be benchmarked against peers. Discuss whether the market is pricing in different
    growth expectations.


    3. HBM Investment Race: Compare each company''s HBM investment timeline and capacity
    plans. How does Micron''s strategy of investing in back-end packaging equipment
    and new fabs in Idaho and New York compare to Samsung''s and SK Hynix''s approaches?
    Assess which company has the most sustainable CapEx trajectory given the 10% NAND
    capacity reduction discipline maintained by Micron.'
