judge_rubric: 'Evaluate the Micron geographic expansion analysis against the following
  rubric:


  POSITIVE SCORING ITEMS (total 100%):

  1. [Weight 12%] Idaho fab project details (brownfield, Boise site, timeline, investment)

  2. [Weight 12%] New York fab project details (greenfield, Clay/Syracuse, megasite
  scale)

  3. [Weight 10%] Comparison of Idaho vs New York investment economics and capacity
  plans

  4. [Weight 10%] Integration of both projects within $13.8B FY2025 and $20B FY2026
  CapEx framework

  5. [Weight 10%] International footprint analysis (Singapore, Japan, China operations)

  6. [Weight 8%] CHIPS Act subsidy role in geographic decision-making

  7. [Weight 8%] OCF ($17.5B) as funding source for geographic expansion

  8. [Weight 8%] Long lead time analysis — post-2027 capacity release

  9. [Weight 8%] $42.6B breakeven revenue during construction phase

  10. [Weight 7%] 10% NAND reduction as resource reallocation to support new fabs

  11. [Weight 7%] Clear conclusion on prudent positioning vs over-investment risk


  NEGATIVE SCORING ITEMS (deduct when present):

  12. [Deduct 5%] Confusing Idaho and New York project characteristics

  13. [Deduct 4%] Ignoring CHIPS Act impact on economics

  14. [Deduct 4%] Missing currency units or timeline inconsistencies'
reference_solution: '1. Idaho: Brownfield expansion at Boise; lower risk, faster ramp;
  focused on DRAM. Fab economics favor lower upfront cost.

  2. New York: Greenfield megasite in Clay; larger investment, longer timeline; multiple
  cleanrooms.

  3. Combined investment fits within $13.8B FY2025 and $20B FY2026 CapEx guidance.

  4. International: Singapore (NAND/DRAM), Japan (DRAM), China (legacy) — US adds
  geographic diversification.

  5. CHIPS Act subsidies offset ~10-15% of US fab costs; critical to fab economics.

  6. Post-2027 capacity release means $42.6B breakeven must be met with existing facilities
  during construction; OCF of $17.5B supports this.

  7. 10% NAND reduction frees capital and management bandwidth for new fab projects.'
primary_dimensions:
