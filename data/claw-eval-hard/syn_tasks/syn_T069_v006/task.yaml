task_id: syn_T069_v006
task_name: Micron FY2025 Geographic Fab Expansion Analysis
version: '1.0'
category: finance
difficulty: easy
tags:
- general
services:
- name: web_real
  command: python mock_services/web_real/server.py
  port: 9114
  health_check: http://localhost:9114/web/health
  health_check_method: GET
  ready_timeout: 10
  reset_endpoint: http://localhost:9114/web/reset
prompt:
  text: 'Micron Technology is undertaking its largest geographic expansion in company
    history, with major fab investments in both Idaho (Boise) and New York (Clay/Syracuse
    area), alongside existing operations in Asia. This expansion is central to the
    company''s FY2025-2027 capital expenditure plan.


    As a facilities and geographic strategy analyst, evaluate Micron''s expansion
    economics using FY2025 financial data and publicly available information. Complete
    the following:


    1. Idaho vs New York Fab Economics: Compare the two major US fab projects. The
    Idaho expansion focuses on existing site brownfield development while New York
    represents a greenfield megasite. Analyze the investment scale, expected capacity,
    and timeline for each. How do these fit within the $13.8B FY2025 CapEx and the
    $20B FY2026 guidance?


    2. International Footprint Context: Micron maintains significant manufacturing
    in Asia (Singapore, Japan, China). How does the US expansion complement or duplicate
    existing international capacity? Consider the role of CHIPS Act subsidies in the
    geographic decision. With OCF of $17.5B funding much of the expansion, assess
    the geographic diversification strategy.


    3. Capacity Timeline and Financial Impact: New fabs have long lead times — capacity
    from Idaho and New York is not expected until 2027 or later. Calculate the breakeven
    revenue ($42.6B at $20B CapEx / 47% OCF margin) needed to sustain spending during
    the construction phase. How does the 10% NAND capacity reduction relate to resource
    allocation for these new facilities? Assess whether the geographic expansion represents
    prudent long-term positioning or over-investment risk.'
  language: en
