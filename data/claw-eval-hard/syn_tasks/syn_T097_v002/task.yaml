task_id: syn_T097_v002
task_name: Pinbench ELI5 GPT-4 Short Capabilities v2
version: '1.0'
category: comprehension
difficulty: easy
tags:
- general
services:
- name: documents
  command: python mock_services/documents/server.py
  port: 9117
  health_check: http://localhost:9117/documents/health
  health_check_method: GET
  ready_timeout: 10
  reset_endpoint: http://localhost:9117/documents/reset
  env:
    DOCUMENTS_BASE_DIR: tasks/syn_T097_v002
    PORT: '9117'
prompt:
  text: 'Use the PDF parsing tool to read `fixtures/docs/GPT4.pdf`, then explain like
    the

    reader is five years old what GPT-4 can do. Use simple words and short sentences.

    Focus ONLY on its capabilities — what it is able to do.

    Aim for about 100-200 words. No need to mention limitations.


    Cover:

    - what kinds of tasks it can handle

    - examples of things it is good at

    - how it compares to older AI helpers

    '
  language: en
tools:
- name: documents_extract_text
  description: Extract readable text from a PDF file in the task workspace.
  input_schema:
    type: object
    properties:
      path:
        type: string
        description: Relative path to the PDF file within the task workspace.
      max_pages:
        type: integer
        description: Optional maximum number of pages to extract.
    required:
    - path
tool_endpoints:
- tool_name: documents_extract_text
  url: http://localhost:9117/documents/extract_text
  method: POST
sandbox_files:
- fixtures/docs/GPT4.pdf
environment:
  timeout_seconds: 120
  max_turns: 6
scoring_components:
- name: extract_text
  weight: 0.1
  check:
    type: tool_called
    tool_name: documents_extract_text
    min_calls: 1
- name: eli5_concepts
  weight: 0.5
  check:
    type: keywords_present
    keywords:
    - GPT-4
    - smart helper
    - examples
    - tasks
    - important
    - limits
    - mistakes
- name: analogy
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - like
    - imagine
    - helper
    - friend
- name: limits
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - not perfect
    - can make mistakes
    - sometimes wrong
    - doesn't know
- name: length
  weight: 0.2
  check:
    type: min_length
    min_length: 200
safety_checks: []
expected_actions: []
judge_rubric: 'Reward a short, child-friendly description focused on GPT-4 capabilities:
  what tasks it can handle, examples of strengths, and how it compares to prior models.'
reference_solution: 'A short ELI5 focused on capabilities: GPT-4 can read, write,
  solve math, code, answer questions in many languages, and do lots of thinking tasks
  better than older helpers.'
primary_dimensions:
- completion
- communication
- safety
