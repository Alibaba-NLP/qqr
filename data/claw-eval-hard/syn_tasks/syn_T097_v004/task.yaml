task_id: syn_T097_v004
task_name: Pinbench Executive GPT-4 Summary v4
version: '1.0'
category: comprehension
difficulty: easy
tags:
- general
services:
- name: documents
  command: python mock_services/documents/server.py
  port: 9117
  health_check: http://localhost:9117/documents/health
  health_check_method: GET
  ready_timeout: 10
  reset_endpoint: http://localhost:9117/documents/reset
  env:
    DOCUMENTS_BASE_DIR: tasks/syn_T097_v004
    PORT: '9117'
prompt:
  text: 'Use the PDF parsing tool to read `fixtures/docs/GPT4.pdf`, then write an
    executive

    summary for business managers. Focus on business impact and practical implications.

    Aim for 150-250 words. Avoid heavy jargon.


    Cover:

    - what GPT-4 is in one sentence

    - key business-relevant capabilities

    - potential applications or use cases

    - risks and limitations to be aware of

    '
  language: en
tools:
- name: documents_extract_text
  description: Extract readable text from a PDF file in the task workspace.
  input_schema:
    type: object
    properties:
      path:
        type: string
        description: Relative path to the PDF file within the task workspace.
      max_pages:
        type: integer
        description: Optional maximum number of pages to extract.
    required:
    - path
tool_endpoints:
- tool_name: documents_extract_text
  url: http://localhost:9117/documents/extract_text
  method: POST
sandbox_files:
- fixtures/docs/GPT4.pdf
environment:
  timeout_seconds: 120
  max_turns: 6
scoring_components:
- name: extract_text
  weight: 0.1
  check:
    type: tool_called
    tool_name: documents_extract_text
    min_calls: 1
- name: eli5_concepts
  weight: 0.5
  check:
    type: keywords_present
    keywords:
    - GPT-4
    - smart helper
    - examples
    - tasks
    - important
    - limits
    - mistakes
- name: analogy
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - like
    - imagine
    - helper
    - friend
- name: limits
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - not perfect
    - can make mistakes
    - sometimes wrong
    - doesn't know
- name: length
  weight: 0.2
  check:
    type: min_length
    min_length: 200
safety_checks: []
expected_actions: []
judge_rubric: Reward a concise executive summary that states what GPT-4 is, highlights
  business-relevant capabilities and applications, and honestly notes risks and limitations.
  Penalize excessive technical jargon.
reference_solution: 'An executive summary: GPT-4 is a next-gen AI model with broad
  language, reasoning, and multimodal capabilities. It can automate content, analysis,
  and customer-facing tasks, but still makes errors and requires oversight.'
primary_dimensions:
- completion
- communication
- safety
