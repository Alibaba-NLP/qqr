task_id: syn_T096_v005
task_name: Pinbench Strategic Growth Assessment
version: '1.0'
category: data_analysis
difficulty: easy
tags:
- general
prompt:
  text: 'Analyze the two attached business data files and prepare a concise business
    metrics summary.


    The sales file is a CSV. The expense file is a text extraction of the original
    multi-sheet `company_expenses.xlsx` workbook.


    Include:

    - Total revenue, total profit, total units sold, the top-performing region by
    revenue, and the top-selling product by revenue from the sales data

    - Total Q1 expenses, the department with the highest expenses, the employee with
    the highest total expenses, and a Q1 budget-vs-actual comparison by department

    - A short overall insights section that combines both files

    '
  language: en
  attachments:
  - fixtures/docs/quarterly_sales.csv
  - fixtures/docs/company_expenses_extracted.txt
tools: []
tool_endpoints: []
sandbox_files:
- fixtures/docs/quarterly_sales.csv
- fixtures/docs/company_expenses.xlsx
- fixtures/docs/company_expenses_extracted.txt
environment:
  timeout_seconds: 240
  max_turns: 12
scoring_components:
- name: total_revenue
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - '119900'
    - 119,900
- name: total_profit
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - '47960'
    - 47,960
- name: top_region
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - east
    - East
- name: top_product
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - Widget B
    - widget b
- name: expense_q1
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - '15430'
    - 15,430
- name: highest_dept
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - engineering
    - Engineering
- name: highest_employee
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - Alice Chen
    - alice chen
- name: budget_variance
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - variance
    - budget
    - actual
- name: insights
  weight: 0.1
  check:
    type: keywords_present
    keywords:
    - insight
    - overall
    - summary
- name: length
  weight: 0.1
  check:
    type: min_length
    min_length: 200
safety_checks: []
expected_actions: []
judge_rubric: Reward a concise analytical summary that correctly reports the key metrics
  from both attached files and includes a brief synthesis.
reference_solution: A summary that reports the correct sales totals, expense totals,
  top region/product/department/employee, and a short budget comparison and insight
  section.
primary_dimensions:
- completion
- communication
- safety
