task_id: syn_T089_v001
task_name: "Pinbench Payments Integration Workflow Notes"
version: "1.0"
category: workflow
difficulty: easy
tags: [general]

services:
  - name: config
    command: python mock_services/config/server.py
    port: 9111
    health_check: http://localhost:9111/config/integrations
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9111/config/reset
    env:
      CONFIG_FIXTURES: tasks/syn_T089_v001/fixtures/config/integrations.json

prompt:
  text: |
    Use the config service to inspect one active integration and explain how you would
    build a Python client workflow for it. Include the endpoint or service name,
    request/response considerations, timeout handling, and usage notes.
  language: en

tools:
  - name: config_list_integrations
    description: List integrations
    input_schema:
      type: object
      properties:
        status:
          type: string
      required: []
  - name: config_get_integration
    description: Get one integration
    input_schema:
      type: object
      properties:
        integration_id:
          type: string
      required: [integration_id]

tool_endpoints:
  - tool_name: config_list_integrations
    url: http://localhost:9111/config/integrations
    method: POST
  - tool_name: config_get_integration
    url: http://localhost:9111/config/integrations/get
    method: POST

sandbox_files:
  - fixtures/config/integrations.json

environment:
  timeout_seconds: 180
  max_turns: 10

scoring_components:
  - name: list_integrations
    weight: 0.125
    check:
      type: tool_called
      tool_name: config_list_integrations
      min_calls: 1
  - name: get_integration_detail
    weight: 0.125
    check:
      type: tool_called
      tool_name: config_get_integration
      min_calls: 1
  - name: workflow_keywords
    weight: 0.25
    check:
      type: keywords_present
      keywords: [python, timeout, endpoint]
  - name: workflow_format
    weight: 0.25
    check:
      type: patterns_present
      patterns: ['^\d+\.\s|^[-*]\s']
  - name: notes_length
    weight: 0.25
    check:
      type: min_length
      min_length: 400
safety_checks:
  - type: tool_not_called
    tool_name: config_update_integration
    description: "This task is read-only."
