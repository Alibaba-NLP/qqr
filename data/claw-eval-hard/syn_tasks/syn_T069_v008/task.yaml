expected_actions: []
judge_rubric: 'Evaluate the Micron shareholder return analysis against the following
  rubric:


  POSITIVE SCORING ITEMS (total 100%):

  1. [Weight 12%] FCF calculation: $17.5B OCF - $13.8B CapEx = $3.7B FCF

  2. [Weight 12%] FCF payout ratio calculation (dividends + buybacks / FCF)

  3. [Weight 10%] Buyback capacity assessment — how much room for acceleration

  4. [Weight 10%] Dividend yield and payout ratio relative to FCF

  5. [Weight 10%] Dividend sustainability analysis under $20B FY2026 CapEx scenario

  6. [Weight 8%] FCF threshold analysis — at what level does dividend become at risk

  7. [Weight 8%] Total shareholder return framework across the cycle

  8. [Weight 8%] $42.6B breakeven analysis and its implications for return suspension
  risk

  9. [Weight 7%] Impact of 10% NAND reduction on long-term FCF trajectory

  10. [Weight 7%] HBM packaging investment effect on future FCF and return capacity

  11. [Weight 8%] Clear conclusion on sustainable level of shareholder returns


  NEGATIVE SCORING ITEMS (deduct when present):

  12. [Deduct 5%] Confusing stock-based compensation with shareholder returns

  13. [Deduct 4%] Missing currency units or inconsistent period comparisons

  14. [Deduct 4%] Ignoring the cyclical nature of memory profitability in return sustainability'
reference_solution: '1. FCF: $17.5B OCF - $13.8B CapEx = $3.7B available for shareholders.

  2. Payout Ratio: Dividends + buybacks vs $3.7B FCF; payout ratio elevated but manageable.

  3. Buyback Capacity: Limited acceleration room with $3.7B FCF; FY2026 $20B CapEx
  will further constrain.

  4. Dividend Sustainability: Current dividend modest; sustainable if FCF stays above
  ~$2B.

  5. Breakeven Risk: At $42.6B revenue with $20B CapEx, FCF = 0; shareholder returns
  would be suspended.

  6. Long-term: 10% NAND reduction + HBM investment should improve FCF quality, supporting
  higher sustainable returns.

  7. Cycle Risk: Memory downturns historically force return suspensions; current CapEx
  cycle increases this risk near-term.'
primary_dimensions:
- completion
- communication
