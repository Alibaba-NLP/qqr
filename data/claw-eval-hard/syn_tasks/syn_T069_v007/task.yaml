task_name: Micron FY2025 NAND vs DRAM Capacity Allocation Analysis
version: '1.0'
category: finance
difficulty: easy
tags:
- general
services:
- name: web_real
  command: python mock_services/web_real/server.py
  port: 9114
  health_check: http://localhost:9114/web/health
  health_check_method: GET
  ready_timeout: 10
  reset_endpoint: http://localhost:9114/web/reset
prompt:
  text: 'Micron Technology operates as a dual-product memory company, generating revenue
    from both DRAM and NAND flash semiconductors. The allocation of wafer capacity
    and capital expenditure between these two segments is a critical strategic decision
    that directly impacts profitability.


    As a memory sector analyst, analyze Micron''s NAND vs DRAM allocation strategy
    using FY2025 data. Complete the following:


    1. Wafer Capacity Split: Determine Micron''s current wafer capacity allocation
    between DRAM and NAND. Management has announced a 10% reduction in NAND wafer
    capacity — analyze what this means for the DRAM/NAND split. With total CapEx of
    $13.8B in FY2025, how is investment distributed between the two segments?


    2. Pricing Trends and Revenue Contribution: Compare DRAM vs NAND pricing trends
    in FY2025. DRAM typically represents 65-75% of Micron''s revenue. How does the
    10% NAND reduction affect the revenue mix? With operating cash flow of $17.5B,
    assess which segment is the primary cash generator and how the allocation supports
    margin expansion.


    3. Margin Contribution by Segment: Analyze the margin differential between DRAM
    and NAND. HBM (a DRAM product) commands significant ASP premiums. How does shifting
    capacity from NAND to DRAM/HBM impact blended margins? Evaluate whether the $3.7B
    FCF ($17.5B OCF - $13.8B CapEx) reflects the improved segment mix. For FY2026
    with $20B CapEx and $42.6B breakeven revenue, assess whether the DRAM-heavy allocation
    strategy is sustainable.'
  language: en
