judge_rubric: 'Evaluate the Micron NAND vs DRAM allocation analysis against the following
  rubric:


  POSITIVE SCORING ITEMS (total 100%):

  1. [Weight 12%] Current DRAM/NAND wafer capacity split identification

  2. [Weight 12%] 10% NAND reduction impact on capacity split analysis

  3. [Weight 10%] CapEx distribution between DRAM and NAND within $13.8B total

  4. [Weight 10%] DRAM vs NAND pricing trend comparison for FY2025

  5. [Weight 10%] Revenue mix analysis (DRAM ~65-75% of total)

  6. [Weight 10%] Identification of DRAM as primary cash generator within $17.5B OCF

  7. [Weight 8%] Margin differential between DRAM and NAND segments

  8. [Weight 8%] HBM (DRAM product) ASP premium impact on blended margins

  9. [Weight 7%] FCF of $3.7B ($17.5B - $13.8B) as reflection of improved segment
  mix

  10. [Weight 7%] Sustainability assessment of DRAM-heavy strategy at $20B FY2026
  CapEx

  11. [Weight 6%] $42.6B breakeven analysis in context of segment allocation


  NEGATIVE SCORING ITEMS (deduct when present):

  12. [Deduct 5%] Confusing NAND and DRAM characteristics or market dynamics

  13. [Deduct 4%] Ignoring HBM as a DRAM sub-segment in the analysis

  14. [Deduct 4%] Missing currency units or inconsistent segment data'
reference_solution: '1. Capacity Split: DRAM ~70% / NAND ~30% of wafer capacity; 10%
  NAND reduction shifts wafer allocation toward ~75/25.

  2. CapEx Distribution: Majority of $13.8B directed to DRAM/HBM; NAND investment
  focused on maintenance.

  3. Pricing: DRAM ASPs rising with HBM premium; NAND pricing relatively flat.

  4. Revenue Mix: DRAM ~70% of revenue; NAND ~30%. Shift improves blended margins.

  5. Margin: DRAM margins higher than NAND; HBM commands 3-5x ASP premium.

  6. FCF $3.7B reflects improved mix; OCF $17.5B driven primarily by DRAM/HBM strength.

  7. FY2026 $20B CapEx sustainable if DRAM-heavy mix continues; $42.6B breakeven achievable
  with HBM revenue growth.'
primary_dimensions:
