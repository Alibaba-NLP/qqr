judge_rubric: 'Evaluate the Micron historical cycle analysis against the following
  rubric:


  POSITIVE SCORING ITEMS (total 100%):

  1. [Weight 15%] Identification of at least 3 distinct CapEx cycles with approximate
  date ranges

  2. [Weight 12%] CapEx/Revenue ratio tracking showing peak and trough values for
  each cycle

  3. [Weight 12%] Analysis of what triggered peak spending in each historical cycle

  4. [Weight 10%] Discussion of consequences following peak CapEx (oversupply, price
  collapse, write-downs)

  5. [Weight 10%] Current cycle metrics: $13.8B CapEx, $17.5B OCF, 1.27x coverage
  ratio

  6. [Weight 10%] Comparison of current cycle''s coverage ratio to historical patterns

  7. [Weight 8%] Discussion of 10% NAND capacity reduction as evidence of discipline

  8. [Weight 8%] Analysis of HBM packaging investment as structural vs cyclical spending

  9. [Weight 8%] Idaho/New York fab timeline (post-2027) as differentiator

  10. [Weight 7%] $42.6B breakeven analysis supporting cycle sustainability argument


  NEGATIVE SCORING ITEMS (deduct when present):

  11. [Deduct 6%] Treating all cycles as identical without noting structural differences

  12. [Deduct 4%] Missing currency units or inconsistent fiscal year references

  13. [Deduct 4%] Failing to draw a clear conclusion about structural break vs cycle
  repetition'
reference_solution: '1. Three historical cycles identified: FY2016-2019 (3D NAND ramp),
  FY2020-2023 (pandemic boom/bust), FY2024-2025 (AI/HBM).

  2. Peak CapEx/Revenue ratios: ~35-40% in each cycle. Current FY2025 peak ~37% ($13.8B/~$37B).
  Trough ratios ~15-20%.

  3. Past peaks led to oversupply and price collapses; current 1.27x coverage ratio
  is healthier than historical patterns.

  4. Structural differences: 10% NAND reduction + HBM packaging focus + Idaho/NY fabs
  with post-2027 capacity.

  5. $42.6B breakeven revenue ($20B/47%) is achievable given AI demand trajectory
  — suggests structural break from past boom-bust patterns.'
primary_dimensions:
- completion
- communication
