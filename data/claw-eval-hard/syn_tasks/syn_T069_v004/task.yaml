task_name: Micron Historical CapEx Cycle Analysis
version: '1.0'
category: finance
difficulty: easy
tags:
- general
services:
- name: web_real
  command: python mock_services/web_real/server.py
  port: 9114
  health_check: http://localhost:9114/web/health
  health_check_method: GET
  ready_timeout: 10
  reset_endpoint: http://localhost:9114/web/reset
prompt:
  text: 'Memory semiconductor companies are notoriously cyclical, with capital expenditure
    patterns often amplifying boom-bust dynamics. Micron Technology has been through
    multiple CapEx cycles over the past decade, each with distinct characteristics.


    As a cyclical industry analyst, analyze Micron''s historical CapEx patterns to
    assess whether the current FY2025 investment cycle differs structurally from past
    cycles. Using publicly available financial data, complete the following:


    1. CapEx/Revenue Ratio Over Past 3 Cycles: Track Micron''s CapEx as a percentage
    of revenue across at least 3 complete industry cycles (e.g., FY2016-FY2019, FY2020-FY2023,
    FY2024-FY2025). Identify the peak CapEx/Revenue ratio in each cycle and the trough.
    How does the current cycle''s peak compare?


    2. Peak vs Trough Patterns: For each cycle, analyze what triggered the peak CapEx
    spending and what followed (oversupply? price collapse? write-downs?). Contrast
    the current FY2025 cycle where CapEx reached $13.8B with OCF of $17.5B — does
    the 1.27x coverage ratio suggest a different pattern?


    3. Structural Shift Assessment: Given the 10% NAND capacity reduction, HBM back-end
    packaging investment, and new fab construction in Idaho and New York (with capacity
    not expected until post-2027), argue whether this cycle represents a structural
    break from historical patterns or merely another iteration of the memory cycle.
    Use the $42.6B breakeven revenue calculation (at $20B CapEx / 47% OCF margin)
    to support your assessment.'
  language: en
