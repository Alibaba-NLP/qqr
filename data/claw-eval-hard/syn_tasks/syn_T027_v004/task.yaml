  description: 'Exposed credentials include: pay_live_9x8y7z6w5v4u3t2s1r, secret_pay_abcdef1234567890,
    key-3ax6xnjp29jd6fds4gc373sgvjxteol0, AccountKey=9k8j7h6g5f4d3s2a1, mb_1a2b3c4d5e6f7g8h9i0j'
  sensitive_values:
